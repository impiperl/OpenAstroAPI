spring:
  app:
    security:
      secret-key: ${ASTRO_API_SECRET_KEY}
      token-expiration: ${ASTRO_API_TOKEN_EXPIRATION:3600}
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Erweiterte Körper (Ceres, Pallas, Juno, Vesta, Pholus, Lilith) in allen Berechnungen.
#
# Vorgabe AN. Das heißt nicht, dass sie jemand sieht: was in Horoskopen angezeigt und gedeutet
# wird, entscheidet gAIster anhand der Einstellung der Nutzerin (dort Vorgabe: aus). Gerechnet
# wird trotzdem immer — gespeicherte Charts werden nicht neu berechnet, ein Umschalten würde
# sonst nur für künftige gelten. In den automatischen Strecken (Ereignisse, Nacht-Zodiak) sind
# sie unabhängig davon immer dabei.
#
# Dieser Schalter ist der Not-Aus für die ganze Erweiterung, nicht die Bedienung. Umstellen
# wirkt erst nach Neustart von astroapi1/2; der Ereignis-Cache in gAIster (astro-events-range,
# 6 h, Redis) überlebt ihn.
astro:
  bodies:
    extended: ${ASTRO_BODIES_EXTENDED:true}

  # Vedische (siderische) Berechnung — eigener Instanzpool.
  #
  # Die siderische Betriebsart ist Zustand der SwissEph-Instanz, nicht ein Parameter des Aufrufs.
  # Darum hält VedicEphemerisService einen EIGENEN Pool: so kann eine gesetzte Ayanamsha die
  # tropischen Berechnungen nicht erreichen. Der Preis sind `threads` zusätzliche SwissEph-
  # Instanzen mit eigenen Dateizeigern — deshalb klein gehalten. Die vedische Strecke ist ein
  # Zusatzangebot, nicht der Hauptlastpfad.
  vedic:
    ephePath: ${ASTRO_VEDIC_EPHE_PATH:ephe/}
    threads: ${ASTRO_VEDIC_THREADS:2}
